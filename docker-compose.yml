services:
  postgres:
    image: postgres:16-alpine
    container_name: beauty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty
      POSTGRES_DB: beauty_ingredient
    ports:
      # Hostta 5433; böylece yerel bir PostgreSQL 5432'de çalışmaya devam edebilir.
      - "5433:5432"
    volumes:
      - beauty-pgdata:/var/lib/postgresql/data
      # Şema artık initdb ile değil, göçlerle yükleniyor: `make migrate`.
      # initdb yalnızca volume ilk oluşturulduğunda çalıştığı için şema
      # değiştirmenin tek yolu tüm veriyi silmekti.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty -d beauty_ingredient"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beauty-pgdata:
